<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>AccessWatch — Memberships</title>
    <style>
    body { font: 14px system-ui, -apple-system, Segoe UI, Roboto, Arial; margin: 24px; }
    h1 { margin: 0 0 16px 0; }
    .pill { background:#eee; padding:1px 6px; border-radius: 10px; }
    .toolbar { display:flex; gap:8px; margin-bottom:12px; }
    .toolbar a, .toolbar button { text-decoration:none; border:none; background:#eee; border-radius:10px; padding:4px 8px; cursor:pointer; }
    .muted { color:#666; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ddd; padding: 8px; }
    th { background:#f5f5f5; text-align:left; }
    </style>
</head>
<body>
    <h1>AccessWatch — Memberships</h1>
    <div class="toolbar">
        <a class="pill" href="/ui/findings">Findings (UI)</a>
        <a class="pill" href="/findings">Findings (JSON)</a>
        <a class="pill" href="/memberships.csv">Download CSV</a>
        <span class="muted">Updated: {{ updated_at }}</span>
    </div>

    <table>
    <thead>
        <tr>
            <th>Source</th>
            <th>Group</th>
            <th>Member</th>
            <th>Type</th>
        </tr>
    </thead>
    <tbody>
        {% for r in memberships %}
        <tr>
            <td>{{ r.source }}</td>
            <td>{{ r.group_name }}</td>
            <td>{{ r.member_name }}</td>
            <td>{{ r.member_type }}</td>
        </tr>
        {% endfor %}
        </tbody>
    </table>
</body>
</html>
